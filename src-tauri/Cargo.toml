[package]
name = "simplewebshell-desktop"
version = "1.0.20260901"
description = "SimpleWebShell remote device management desktop client"
authors = ["FasterEdge"]
edition = "2021"

[lib]
name = "simplewebshell_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]
